name: Reseed the demo

# Rebuilds Northwind Grove every night so the public demo always starts clean.
# THIS EMPTIES EVERY TABLE. It only runs when the repository variable
# RESEED_ENABLED is "true", so a fork or a real deployment is never touched.
# Needs the secrets DATABASE_URL, DIRECT_URL, SUPABASE_URL and
# SUPABASE_SERVICE_ROLE_KEY (see docs/DEPLOY.md).

on:
  schedule:
    - cron: "30 20 * * *" # 02:00 in Bengaluru
  workflow_dispatch:

concurrency:
  group: reseed
  cancel-in-progress: false

jobs:
  reseed:
    if: vars.RESEED_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
